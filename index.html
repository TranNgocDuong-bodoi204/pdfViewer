<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trình xem PDF của mình</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <input id="file-input" type="file" accept="application/pdf" hidden>

  <!-- Màn hình 1: hiện khi chưa có file -->
  <section id="import-view">
    <div id="drop-zone">
      <h1>Trình xem PDF</h1>
      <p>Kéo thả file PDF vào đây hoặc chọn từ máy của bạn.</p>
      <label class="btn primary" for="file-input">Chọn file PDF</label>
      <p id="import-message" role="status"></p>
    </div>
  </section>

  <script type="module">
    const fileInput = document.getElementById("file-input");
    const dropZone = document.getElementById("drop-zone");
    const importMessage = document.getElementById("import-message");

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("pdf-reader", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("files");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function savePdf(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (!new TextDecoder("latin1").decode(bytes.subarray(0, 1024)).includes("%PDF-")) {
        throw new Error("File được chọn không phải PDF hợp lệ.");
      }

      const db = await openDatabase();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction("files", "readwrite");
        transaction.objectStore("files").put({
          bytes,
          name: file.name,
          size: file.size
        }, "current");
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function openFile(file) {
      if (!file) return;
      importMessage.textContent = "";
      try {
        await savePdf(file);
        location.href = "./viewer.html";
      } catch (error) {
        importMessage.textContent = "Không mở được file: " + error.message;
      }
    }

    fileInput.addEventListener("change", () => {
      openFile(fileInput.files[0]);
      fileInput.value = "";
    });

    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("is-over");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("is-over");
    });

    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("is-over");
      openFile(event.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
